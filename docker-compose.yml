services:
  swarmui:
    image: swarmui
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    cap_drop:
      - ALL
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
      # Fork: compile in an SDK stage, run on the ASP.NET runtime (see the file's header).
      dockerfile: launchtools/RuntimeDockerfile.docker
    container_name: swarmui
    restart: unless-stopped
    # uncomment `network_mode: host` if you want to access other services on the host network (eg a separated comfy instance)
    # network_mode: host
    volumes:
      - swarmdata:/SwarmUI/Data
      - swarmdlnodes:/SwarmUI/src/BuiltinExtensions/ComfyUIBackend/DLNodes
      # A host folder rather than the swarmextensions volume, so the image build can compile
      # what is here; the runtime image has no SDK to compile at startup. Rebuild after
      # installing or updating an extension. The old volume is kept as a rollback copy.
      - ./src/Extensions:/SwarmUI/src/Extensions
      - ./Models:/SwarmUI/Models
      - ./Output:/SwarmUI/Output
      - ./src/BuiltinExtensions/ComfyUIBackend/CustomWorkflows:/SwarmUI/src/BuiltinExtensions/ComfyUIBackend/CustomWorkflows
    networks:
      - ollama-net
    ports:
      - "7801:7801"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # change the count to the number of GPUs you want to use.
              count: 1
              capabilities: [gpu]
volumes:
  swarmdata:
    name: swarmdata
  swarmdlnodes:
    name: swarmdlnodes
  swarmextensions:
    name: swarmextensions
networks:
  ollama-net:
    name: ollama-net
    external: true
